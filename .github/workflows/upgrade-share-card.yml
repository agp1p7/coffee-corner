name: Upgrade sharing cards with coffee and tasting details
on:
  push:
    branches: [main]
    paths: [coffee-share-card-renderer.js, .github/workflows/upgrade-share-card.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: coffee-share-card-upgrade
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check coffee-share-card-renderer.js
      - name: Update reviewed sharing card implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          pins = {'coffee-workspace.js':'f1c82d2c70c4ead137db1f3f08f0510008e05c7a','coffee-i18n.js':'c303f80edefc41acea38b79b85f490b4806ae4bc','index.html':'a781f9b63df2da130fe3253faea43830003d0591'}
          for path, expected in pins.items():
              if subprocess.check_output(['git','hash-object',path],text=True).strip() != expected:
                  raise SystemExit('Source changed since review; no files modified: '+path)
          body=Path('coffee-workspace.js').read_text(encoding='utf-8')
          renderer=Path('coffee-share-card-renderer.js').read_text(encoding='utf-8').strip()
          start='async function drawCard(){'
          end='\nfor(const x of [format,publicNote,gearCheck,dateCheck])'
          if body.count(start)!=1 or body.count(end)!=1:
              raise SystemExit('Unexpected card implementation; no files modified.')
          a=body.index(start); b=body.index(end,a)
          body=body[:a]+renderer+'\n'+body[b:]
          pairs=[("公開風味描述（預設不帶入私人筆記）","風味描述（前160字，可修改）"),("Public tasting line (private notes are not copied)","Tasting description (first 160 characters; editable)"),("publicNote.value='';gearCheck.checked=dateCheck.checked=false;","publicNote.value=String(c.taste||'').slice(0,160);gearCheck.checked=dateCheck.checked=false;")]
          for old,new in pairs:
              if body.count(old)!=1:
                  raise SystemExit('Unexpected tasting field; no files modified.')
              body=body.replace(old,new,1)
          html=Path('index.html').read_text(encoding='utf-8')
          old='./coffee-workspace.js?v=1'
          if html.count(old)!=1:
              raise SystemExit('Unexpected module loader; no files modified.')
          html=html.replace(old,'./coffee-workspace.js?v=2',1)
          lang=Path('coffee-i18n.js').read_text(encoding='utf-8').replace('2.8.0','2.8.1')
          setup=Path('.github/workflows/install-workspace.yml').read_text(encoding='utf-8')
          if setup.count('if marker not in html:')!=1:
              raise SystemExit('Unexpected workspace installer; no files modified.')
          setup=setup.replace('if marker not in html:',"if './coffee-workspace.js?v=' not in html:",1)
          with tempfile.TemporaryDirectory() as temp:
              test=Path(temp)/'workspace.js';test.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(test)],check=True)
          for path,value in {'coffee-workspace.js':body,'index.html':html,'coffee-i18n.js':lang,'.github/workflows/install-workspace.yml':setup}.items():
              Path(path).write_text(value,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coffee-workspace.js index.html coffee-i18n.js .github/workflows/install-workspace.yml
          git commit -m "Include bean information and editable tasting notes on share cards"
          git push origin HEAD:main
      - name: Rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/agp1p7/coffee-corner/pages/builds
