name: Publish verified coffee site
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-coffee.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: read
  id-token: write
concurrency:
  group: coffee-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install approved share card
        id: install
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap, subprocess
          p=Path('coffee-workspace.js')
          body=p.read_text(encoding='utf-8')
          if "publicNote.value=String(c.taste||'').slice(0,160)" not in body or 'const beanInfo=' not in body:
              workflow=Path('.github/workflows/upgrade-share-card.yml').read_text(encoding='utf-8')
              match=re.search(r"python3 - <<'PY'\n(.*?)\n          PY",workflow,re.S)
              if not match:
                  raise SystemExit('Approved installer could not be located.')
              exec(compile(textwrap.dedent(match.group(1)),'approved-share-card-installer','exec'),{})
          html=Path('index.html').read_text(encoding='utf-8')
          html=html.replace('./coffee-i18n.js?v=1','./coffee-i18n.js?v=281')
          Path('index.html').write_text(html,encoding='utf-8')
          body=p.read_text(encoding='utf-8')
          if 'const beanInfo=' not in body or "publicNote.value=String(c.taste||'').slice(0,160)" not in body or './coffee-workspace.js?v=2' not in html:
              raise SystemExit('The approved 2.8.1 card is not connected; publishing stopped.')
          for js in Path('.').glob('*.js'):
              subprocess.run(['node','--check',str(js)],check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coffee-workspace.js coffee-i18n.js index.html .github/workflows/install-workspace.yml
          if ! git diff --cached --quiet; then
            git commit -m "Connect approved 2.8.1 card for verified publishing"
            git push origin HEAD:main
          fi
          git rev-parse HEAD > /tmp/coffee-publish-sha
      - name: Read existing Pages configuration
        id: site
        run: |
          gh api repos/agp1p7/coffee-corner/pages > /tmp/coffee-pages.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          site=json.loads(Path('/tmp/coffee-pages.json').read_text())
          kind=site.get('build_type','legacy')
          if kind not in ('legacy','workflow'):
              raise SystemExit('Unknown Pages build type; settings were not changed.')
          if kind=='legacy' and (site.get('source',{}).get('branch')!='main' or site.get('source',{}).get('path')!='/'):
              raise SystemExit('Pages does not publish main:/; settings were not changed.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('kind='+kind+'\npage_url='+site['html_url']+'\n')
          PY
      - name: Publish existing branch-based Pages site
        id: legacy
        if: steps.site.outputs.kind == 'legacy'
        run: |
          gh api --method POST repos/agp1p7/coffee-corner/pages/builds
          python3 - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          expected=Path('/tmp/coffee-publish-sha').read_text().strip()
          for attempt in range(60):
              result=json.loads(subprocess.check_output(['gh','api','repos/agp1p7/coffee-corner/pages/builds/latest'],text=True))
              if result.get('commit')==expected:
                  if result.get('status')=='built':
                      break
                  if result.get('status')=='errored':
                      raise SystemExit(result.get('error',{}).get('message') or 'Pages build failed.')
              time.sleep(5)
          else:
              raise SystemExit('Timed out waiting for the requested Pages revision.')
          PY
      - name: Configure existing workflow-based Pages site
        if: steps.site.outputs.kind == 'workflow'
        uses: actions/configure-pages@v5
      - name: Prepare static website artifact
        if: steps.site.outputs.kind == 'workflow'
        run: |
          mkdir -p _site
          cp index.html .nojekyll recipe-draft-fix.js coffee-*.js _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Upload website artifact
        if: steps.site.outputs.kind == 'workflow'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy workflow-based Pages site
        if: steps.site.outputs.kind == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live website and sharing-card source
        id: verify
        run: |
          python3 - <<'PY'
          import json, hashlib, urllib.request, urllib.parse, time
          from pathlib import Path
          site=json.loads(Path('/tmp/coffee-pages.json').read_text())
          base=site['html_url'].rstrip('/')+'/'
          sha=Path('/tmp/coffee-publish-sha').read_text().strip()
          expected=hashlib.sha256(Path('coffee-workspace.js').read_bytes()).hexdigest()
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base+'?verify='+sha,timeout=20) as r:
                      html=r.read().decode('utf-8')
                  url=urllib.parse.urljoin(base,'coffee-workspace.js')+'?verify='+sha
                  with urllib.request.urlopen(url,timeout=20) as r:
                      actual=hashlib.sha256(r.read()).hexdigest()
                  if './coffee-workspace.js?v=2' in html and actual==expected:
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Public website verification did not match the published 2.8.1 source.')
          PY
      - name: Record deployment result
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          SITE: ${{ steps.site.outcome }}
          LEGACY: ${{ steps.legacy.outcome }}
          ACTIONS_DEPLOY: ${{ steps.deployment.outcome }}
          VERIFIED: ${{ steps.verify.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, subprocess
          from pathlib import Path
          p=Path('/tmp/coffee-pages.json')
          try:
              site=json.loads(p.read_text())
          except Exception:
              site={}
          sha=Path('/tmp/coffee-publish-sha')
          result={'version':'2.8.1','checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source_sha':sha.read_text().strip() if sha.exists() else None,'url':site.get('html_url'),'steps':{k:os.environ.get(k) for k in ('INSTALL','SITE','LEGACY','ACTIONS_DEPLOY','VERIFIED')}}
          runs=subprocess.run(['gh','run','list','--workflow','upgrade-share-card.yml','--limit','1','--json','status,conclusion,url'],capture_output=True,text=True)
          if runs.returncode==0:
              result['previous_installer']=json.loads(runs.stdout)
          Path('.github/coffee-publish-status.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/coffee-publish-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record coffee Pages publishing and live verification result"
            git push origin HEAD:main
          fi
